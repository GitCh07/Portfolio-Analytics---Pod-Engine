name: Refresh reports with real market data

# Runs the engine on real prices (free Yahoo Finance data, no API key) on GitHub's servers
# and commits the refreshed reports and viewer data. Weekdays after the US close, or on demand
# from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  schedule:
    - cron: "17 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: podengine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: podengine/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Engine run on real prices (report and viewer data)
        run: python -m podengine run --viz
      - name: Example portfolio through the optimizer (real prices)
        run: python -m podengine optimize --positions examples/positions_example.csv --views examples/views_example.json --viz
      - name: Commit the refreshed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add viz/data viz/reports
          git diff --cached --quiet && echo "Nothing changed" && exit 0
          git commit -m "Refresh reports with real market data"
          git push
