<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>viewer self-test</title><link rel="stylesheet" href="viz.css"></head>
<body>
<div id="t"></div><div style="height:6000px"></div><pre id="result">pending</pre>
<script type="module">
// Test harness only (used by tests/test_viz.py). Counts requestAnimationFrame calls and
// checks the animations toggle, lazy loading and the off-screen pause.
const calls = { n: 0 };
const orig = window.requestAnimationFrame.bind(window);
window.requestAnimationFrame = (cb) => { calls.n++; return orig(cb); };
try { localStorage.setItem("podengine.viz.animations", "off"); } catch (e) {}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const out = {};
try {
  const { init } = await import("./js/app.js");
  const c = init(document.getElementById("t"));
  for (const id of ["fan", "calibration", "regimes", "frontier", "exposure"]) { await c.select(id); await sleep(250); }
  await sleep(500);
  const res = () => performance.getEntriesByType("resource").map((e) => e.name);
  out.off_raf = calls.n;
  out.off_anim_loaded = c.animLoaded();
  out.off_anim_fetched = res().filter((n) => /anim\.js/.test(n)).length;
  out.off_views_loaded = c.viewsLoaded();
  out.off_play_disabled = [...document.querySelectorAll(".pv-panel .pv-btn")].every((b) => b.disabled);
  out.canvases_drawn = [...document.querySelectorAll("canvas")].filter((cv) => cv.width > 0).length;
  out.globals_leaked = ["init", "VIEWS", "createAnimator", "STORE_KEY"].filter((k) => k in window);
  await c.setAnimations(true);
  out.on_anim_loaded = c.animLoaded();
  await c.select("calibration");
  document.querySelector("section.pv-panel:not([hidden]) .pv-btn").click();
  await sleep(600);
  out.on_raf = calls.n - out.off_raf;
  out.hidden = document.hidden;
  out.running = c.state.animator && c.state.animator.running();
  out.playing = c.state.views.calibration.playing;
  out.pos = c.state.views.calibration.pos;
  window.scrollTo(0, 5000);
  await sleep(400);
  const a = calls.n; await sleep(600); const b = calls.n;
  out.offscreen_raf = b - a;
  window.scrollTo(0, 0);
  await sleep(500);
  out.resumed_raf = calls.n - b;
  await c.setAnimations(false);
  const d0 = calls.n; await sleep(600);
  out.after_off_raf = calls.n - d0;
  out.pref_saved = localStorage.getItem("podengine.viz.animations");
} catch (e) { out.error = String(e && e.stack || e); }
document.getElementById("result").textContent = JSON.stringify(out);
</script>
</body></html>
